name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore SeaRoute.Net.slnx -m:1 -nr:false

      - name: Build
        run: dotnet build SeaRoute.Net.slnx -c Release --no-restore -m:1 -nr:false

      - name: Test .NET 8 and .NET 10
        run: dotnet test tests/SeaRoute.Tests/SeaRoute.Tests.csproj -c Release --no-build -m:1 -nr:false

      - name: Pack
        run: dotnet pack src/SeaRoute/SeaRoute.csproj -c Release --no-build -m:1 -nr:false -o artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: SeaRoute.Net-package
          path: artifacts/*.nupkg
          if-no-files-found: error

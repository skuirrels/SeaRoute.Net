<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 576" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="output-model-title output-model-desc">
  <title id="output-model-title">SeaRoute.Net output model</title>
  <desc id="output-model-desc">Entity-relationship diagram of the GeoJSON feature returned by SeaRoute.Net: the feature holds a LineString geometry and a properties object carrying length, units, duration, traversed passages and optional origin and destination ports.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b6472"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f6f7f8"/>

  <!-- Relationship lines (drawn first) -->
  <!-- Feature.geometry -> LineString (1:1) -->
  <line x1="384" y1="172" x2="496" y2="172" stroke="#5b6472" stroke-width="1"/>
  <!-- Feature.properties -> SeaRouteProperties (1:1) -->
  <path d="M384,236 H432 Q440,236 440,244 V332 Q440,340 448,340 H496" fill="none" stroke="#5b6472" stroke-width="1"/>
  <!-- Properties.port_origin -> Port (1:0..1) -->
  <line x1="776" y1="356" x2="896" y2="356" stroke="#5b6472" stroke-width="1"/>
  <!-- Properties.port_dest -> Port (1:0..1) -->
  <line x1="776" y1="404" x2="896" y2="404" stroke="#5b6472" stroke-width="1"/>

  <!-- Cardinality labels -->
  <rect x="390" y="166" width="12" height="12" rx="2" fill="#f6f7f8"/>
  <text x="396" y="176" fill="#5b6472" font-size="10" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
  <rect x="478" y="166" width="12" height="12" rx="2" fill="#f6f7f8"/>
  <text x="484" y="176" fill="#5b6472" font-size="10" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>

  <rect x="390" y="230" width="12" height="12" rx="2" fill="#f6f7f8"/>
  <text x="396" y="240" fill="#5b6472" font-size="10" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
  <rect x="478" y="334" width="12" height="12" rx="2" fill="#f6f7f8"/>
  <text x="484" y="344" fill="#5b6472" font-size="10" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>

  <rect x="782" y="350" width="12" height="12" rx="2" fill="#f6f7f8"/>
  <text x="788" y="360" fill="#5b6472" font-size="10" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
  <rect x="860" y="350" width="24" height="12" rx="2" fill="#f6f7f8"/>
  <text x="872" y="360" fill="#5b6472" font-size="10" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">0..1</text>

  <rect x="782" y="398" width="12" height="12" rx="2" fill="#f6f7f8"/>
  <text x="788" y="408" fill="#5b6472" font-size="10" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
  <rect x="860" y="398" width="24" height="12" rx="2" fill="#f6f7f8"/>
  <text x="872" y="408" fill="#5b6472" font-size="10" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">0..1</text>

  <!-- Relationship labels (8px gap from the stroke) -->
  <rect x="412" y="152" width="56" height="12" rx="2" fill="#f6f7f8"/>
  <text x="440" y="161" fill="#6c7484" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">GEOMETRY</text>
  <rect x="364" y="282" width="68" height="12" rx="2" fill="#f6f7f8"/>
  <text x="428" y="291" fill="#6c7484" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.12em">PROPERTIES</text>
  <rect x="800" y="336" width="72" height="12" rx="2" fill="#f6f7f8"/>
  <text x="836" y="345" fill="#6c7484" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">PORT_ORIGIN</text>
  <rect x="804" y="384" width="64" height="12" rx="2" fill="#f6f7f8"/>
  <text x="836" y="393" fill="#6c7484" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">PORT_DEST</text>

  <!-- Entity: GeoJsonFeature (focal, aggregate root) -->
  <rect x="144" y="120" width="240" height="144" rx="6" fill="#f6f7f8"/>
  <rect x="144" y="120" width="240" height="144" rx="6" fill="rgba(10,52,161,0.04)" stroke="#0a34a1" stroke-width="1"/>
  <rect x="144" y="120" width="240" height="40" rx="6" fill="rgba(10,52,161,0.10)" stroke="none"/>
  <rect x="144" y="152" width="240" height="8" fill="rgba(10,52,161,0.10)"/>
  <line x1="144" y1="160" x2="384" y2="160" stroke="rgba(10,52,161,0.40)" stroke-width="1"/>
  <text x="160" y="136" fill="#0a34a1" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY · ROOT</text>
  <text x="160" y="152" fill="#181818" font-size="12" font-weight="600" font-family="'Geist', sans-serif">GeoJsonFeature</text>
  <text x="160" y="180" fill="#181818" font-size="10" font-family="'Geist Mono', monospace">type</text>
  <text x="368" y="180" fill="#5b6472" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">"Feature"</text>
  <text x="160" y="200" fill="#181818" font-size="10" font-family="'Geist Mono', monospace">→ geometry</text>
  <text x="368" y="200" fill="#5b6472" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">GeoJsonLineString</text>
  <text x="160" y="220" fill="#181818" font-size="10" font-family="'Geist Mono', monospace">→ properties</text>
  <text x="368" y="220" fill="#5b6472" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">SeaRouteProperties</text>
  <text x="160" y="240" fill="#181818" font-size="10" font-family="'Geist Mono', monospace">ToJson(indented)</text>
  <text x="368" y="240" fill="#5b6472" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">string</text>

  <!-- Entity: GeoJsonLineString -->
  <rect x="496" y="120" width="240" height="104" rx="6" fill="#f6f7f8"/>
  <rect x="496" y="120" width="240" height="104" rx="6" fill="#ffffff" stroke="#181818" stroke-width="1"/>
  <rect x="496" y="120" width="240" height="40" rx="6" fill="rgba(24,24,24,0.04)" stroke="none"/>
  <rect x="496" y="152" width="240" height="8" fill="rgba(24,24,24,0.04)"/>
  <line x1="496" y1="160" x2="736" y2="160" stroke="rgba(24,24,24,0.22)" stroke-width="1"/>
  <text x="512" y="136" fill="#5b6472" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
  <text x="512" y="152" fill="#181818" font-size="12" font-weight="600" font-family="'Geist', sans-serif">GeoJsonLineString</text>
  <text x="512" y="180" fill="#181818" font-size="10" font-family="'Geist Mono', monospace">type</text>
  <text x="720" y="180" fill="#5b6472" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">"LineString"</text>
  <text x="512" y="200" fill="#181818" font-size="10" font-family="'Geist Mono', monospace">coordinates</text>
  <text x="720" y="200" fill="#5b6472" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">[lon, lat][]</text>

  <!-- Entity: SeaRouteProperties -->
  <rect x="496" y="280" width="280" height="184" rx="6" fill="#f6f7f8"/>
  <rect x="496" y="280" width="280" height="184" rx="6" fill="#ffffff" stroke="#181818" stroke-width="1"/>
  <rect x="496" y="280" width="280" height="40" rx="6" fill="rgba(24,24,24,0.04)" stroke="none"/>
  <rect x="496" y="312" width="280" height="8" fill="rgba(24,24,24,0.04)"/>
  <line x1="496" y1="320" x2="776" y2="320" stroke="rgba(24,24,24,0.22)" stroke-width="1"/>
  <text x="512" y="296" fill="#5b6472" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
  <text x="512" y="312" fill="#181818" font-size="12" font-weight="600" font-family="'Geist', sans-serif">SeaRouteProperties</text>
  <text x="512" y="340" fill="#181818" font-size="10" font-family="'Geist Mono', monospace">length</text>
  <text x="760" y="340" fill="#5b6472" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">double</text>
  <text x="512" y="360" fill="#181818" font-size="10" font-family="'Geist Mono', monospace">units</text>
  <text x="760" y="360" fill="#5b6472" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">"km" · "naut" · "mi" …</text>
  <text x="512" y="380" fill="#181818" font-size="10" font-family="'Geist Mono', monospace">duration_hours</text>
  <text x="760" y="380" fill="#5b6472" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">double</text>
  <text x="512" y="400" fill="#181818" font-size="10" font-family="'Geist Mono', monospace">→ port_origin</text>
  <text x="760" y="400" fill="#5b6472" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">Port?</text>
  <text x="512" y="420" fill="#181818" font-size="10" font-family="'Geist Mono', monospace">→ port_dest</text>
  <text x="760" y="420" fill="#5b6472" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">Port?</text>
  <text x="512" y="440" fill="#181818" font-size="10" font-family="'Geist Mono', monospace">traversed_passages</text>
  <text x="760" y="440" fill="#5b6472" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">string[]?</text>

  <!-- Entity: Port (optional, present only when ports are resolved) -->
  <rect x="896" y="280" width="240" height="200" rx="6" fill="#f6f7f8"/>
  <rect x="896" y="280" width="240" height="200" rx="6" fill="rgba(24,24,24,0.02)" stroke="rgba(24,24,24,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="896" y="280" width="240" height="40" rx="6" fill="rgba(24,24,24,0.04)" stroke="none"/>
  <rect x="896" y="312" width="240" height="8" fill="rgba(24,24,24,0.04)"/>
  <line x1="896" y1="320" x2="1136" y2="320" stroke="rgba(24,24,24,0.22)" stroke-width="1"/>
  <text x="912" y="296" fill="#5b6472" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY · OPTIONAL</text>
  <text x="912" y="312" fill="#181818" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Port</text>
  <text x="912" y="340" fill="#181818" font-size="10" font-family="'Geist Mono', monospace"># port</text>
  <text x="1120" y="340" fill="#5b6472" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">UN/LOCODE</text>
  <text x="912" y="360" fill="#181818" font-size="10" font-family="'Geist Mono', monospace">name</text>
  <text x="1120" y="360" fill="#5b6472" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">string</text>
  <text x="912" y="380" fill="#181818" font-size="10" font-family="'Geist Mono', monospace">cty</text>
  <text x="1120" y="380" fill="#5b6472" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">country</text>
  <text x="912" y="400" fill="#181818" font-size="10" font-family="'Geist Mono', monospace">t</text>
  <text x="1120" y="400" fill="#5b6472" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">1 = terminal</text>
  <text x="912" y="420" fill="#181818" font-size="10" font-family="'Geist Mono', monospace">x, y</text>
  <text x="1120" y="420" fill="#5b6472" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">lon, lat</text>
  <text x="912" y="440" fill="#181818" font-size="10" font-family="'Geist Mono', monospace">to_cty</text>
  <text x="1120" y="440" fill="#5b6472" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">string[]</text>
  <text x="912" y="460" fill="#181818" font-size="10" font-family="'Geist Mono', monospace">share</text>
  <text x="1120" y="460" fill="#5b6472" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">double?</text>

  <!-- Legend strip -->
  <line x1="40" y1="512" x2="1240" y2="512" stroke="rgba(24,24,24,0.10)" stroke-width="0.8"/>
  <text x="40" y="536" fill="#5b6472" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <rect x="128" y="524" width="16" height="12" rx="2" fill="rgba(10,52,161,0.04)" stroke="#0a34a1" stroke-width="1"/>
  <text x="152" y="536" fill="#5b6472" font-size="8" font-family="'Geist Mono', monospace">AGGREGATE ROOT</text>
  <rect x="288" y="524" width="16" height="12" rx="2" fill="#ffffff" stroke="#181818" stroke-width="1"/>
  <text x="312" y="536" fill="#5b6472" font-size="8" font-family="'Geist Mono', monospace">ENTITY</text>
  <rect x="408" y="524" width="16" height="12" rx="2" fill="rgba(24,24,24,0.02)" stroke="rgba(24,24,24,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="432" y="536" fill="#5b6472" font-size="8" font-family="'Geist Mono', monospace">OPTIONAL · NULL WHEN ABSENT</text>
  <text x="656" y="536" fill="#5b6472" font-size="8" font-family="'Geist Mono', monospace">→ REFERENCE</text>
  <text x="784" y="536" fill="#5b6472" font-size="8" font-family="'Geist Mono', monospace"># IDENTIFIER</text>
  <text x="912" y="536" fill="#5b6472" font-size="8" font-family="'Geist Mono', monospace">1 · 0..1 CARDINALITY</text>
</svg>
